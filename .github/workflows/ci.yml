name: Verify local workbench
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install uv==0.12.10
      - run: npm install -g pnpm@11.7.0
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: uv run ruff check backend tests scripts
      - run: uv run pytest -q
      - run: uv run python scripts/check_fixtures.py
      - run: pnpm typecheck && pnpm test && pnpm build
      - run: pnpm generate:api
      - run: git diff --exit-code -- apps/workbench/src/generated/api.ts
      - run: uv run playwright install --with-deps chromium
      - name: Real browser workflow on local synthetic data
        env:
          EASYRESUME_TEST_BROWSER: chromium
          EASYRESUME_TEST_URL: http://127.0.0.1:8771
        run: uv run python "$GITHUB_WORKSPACE/scripts/with_server.py" --server 'uv run easyresume --no-browser --data-dir artifacts/ci-data --port 8771' --port 8771 -- uv run python tests/e2e/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-ui-evidence
          path: artifacts/screenshots
