name: Build Windows test package

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Version matching the source tree (no automatic publication)
        required: true
        default: v0.2.0-beta.1

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install uv==0.12.10
      - run: npm install -g pnpm@11.7.0
      - name: Check, build, and test executable
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: ./scripts/build.ps1 -ReleaseVersion $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: windows-test-release
          path: artifacts/release/*
          if-no-files-found: error
