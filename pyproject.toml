[project]
name = "easyresume"
version = "0.2.0b23"
description = "Local-first, evidence-aware job search workbench"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2", "pydantic>=2.10,<3", "python-multipart>=0.0.20,<1",
  "python-docx>=1.1,<2", "pypdf>=6,<7", "filelock>=3.17,<4", "psutil>=7,<8", "tzdata>=2025.1",
  "httpx>=0.28,<1",
]

[project.scripts]
easyresume = "easyresume.launcher:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "playwright>=1.50,<2", "pyinstaller>=6.12,<7"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
easyresume = ["migrations/*.py", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
