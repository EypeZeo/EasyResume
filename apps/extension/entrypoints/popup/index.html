<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>EasyResume 只读助手</title>
  </head>
  <body>
    <main>
      <header>
        <span class="mark">E</span>
        <div>
          <h1>EasyResume</h1>
          <p>职位助手</p>
        </div>
      </header>
      <p class="notice">打开 BOSS 职位页，读取并保存到工作台。</p>
      <p id="connection" role="status" aria-live="polite">正在检查连接…</p>
      <button id="refresh" class="secondary">重新检查连接</button>
      <section id="pair">
        <label
          >粘贴工作台的连接信息<textarea
            id="connection-info"
            autocomplete="off"
            spellcheck="false"
            placeholder="在工作台生成并复制连接信息，然后粘贴到这里"
          ></textarea>
        </label>
        <button id="connect">连接工作台</button>
        <details>
          <summary>手动连接</summary>
          <p>地址用于找到这台电脑上的 EasyResume，通常无需更改。连接码在工作台生成。</p>
          <label>工作台地址<input id="base" value="http://127.0.0.1:8765" type="url" /></label>
          <label>连接码<input id="code" autocomplete="off" /></label>
          <button id="manual-connect">使用地址和连接码</button>
        </details>
      </section>
      <section id="connected" hidden>
        <button id="read">读取当前职位页</button>
        <div id="preview"></div>
        <label>城市<input id="city" placeholder="如：上海" /></label
        ><label
          >用工类型<select id="employment">
            <option value="unknown">未确认</option>
            <option value="full_time">全职</option>
            <option value="internship">实习</option>
            <option value="part_time">兼职</option>
          </select></label
        ><label
          >招聘对象<select id="recruitment">
            <option value="unknown">未确认</option>
            <option value="campus">校招</option>
            <option value="social">社招</option>
          </select></label
        ><button id="save" disabled>保存到工作台</button>
      </section>
      <button id="disconnect" class="secondary" hidden>断开连接</button
      ><button id="workbench" class="secondary">打开工作台</button
      ><button id="sidepanel" class="secondary">在浏览器侧栏打开</button>
      <p id="status" role="status" aria-live="polite"></p>
      <footer>当前支持读取岗位，自动发送尚不支持。</footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
